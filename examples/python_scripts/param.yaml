# Parameter file for lpt_native_21cm.py, loaded via beorn.structs.Parameters.from_yaml.
#
# Every field below is optional: if you delete a line, BEoRN falls back to its
# built-in default (the value shown here, unless noted otherwise). This file
# spells out every available field so new users can see the full set of knobs
# in one place and only need to touch the ones relevant to their run. Values
# below reproduce the setup used in ../lpt_native_21cm.ipynb.

simulation:
  Ncell: 128                    # grid cells per side; total grid is Ncell^3
  Lbox: 100                     # box length, in Mpc/h (use_hunits below) or physical Mpc
  cores: 4                      # cores for shared-memory parallelization (1 disables it)
  store_grids: ['delta_b', 'Grid_Temp', 'Grid_xHII', 'Grid_xal']  # base fields written to the output HDF5 file
  degrade_resolution: 1          # block-average N-body density grids by this factor before painting
  use_hunits: true                # Lbox above is in Mpc/h, not physical Mpc (default is false: physical Mpc)
  spreading_pixel_threshold: -1   # merge connected regions below this many pixels when spreading excess ionization (-1 = use built-in default)
  spreading_subgrid_approximation: true  # use the subgrid approximation in distance_transform_edt when spreading excess ionization
  minimum_grid_size_heat: 4       # minimum grid size used for the heating kernel
  minimum_grid_size_lyal: 16      # minimum grid size used for the Lyman-alpha kernel
  compute_s_alpha_fluctuations: true  # include S_alpha fluctuations when computing x_al
  compute_x_coll_fluctuations: true   # include x_coll fluctuations when computing x_tot
  backend:
    default: 'numpy'              # fallback backend for any stage below left as null ('numpy' or 'auto')
    profile_painting: null         # backend for the ionization/heating/Lyman-alpha painting FFTs
    mass_assignment: null          # backend for particle-to-mesh painting (map_particles_to_mesh)
    lpt: null                      # backend for the LPT solver's internal FFTs (always converted back to numpy on return)
    hmf: null                      # backend for the halo mass function (jax/torch keep it differentiable, no numpy conversion)

solver:
  redshifts: [20.00, 19.75, 19.50, 19.25, 19.00, 18.75, 18.50, 18.25, 18.00,
              17.75, 17.50, 17.25, 17.00, 16.75, 16.50, 16.25, 16.00, 15.75,
              15.50, 15.25, 15.00, 14.75, 14.50, 14.25, 14.00, 13.75, 13.50,
              13.25, 13.00, 12.75, 12.50, 12.25, 12.00, 11.75, 11.50, 11.25,
              11.00, 10.75, 10.50, 10.25, 10.00,  9.75,  9.50,  9.25,  9.00,
               8.75,  8.50,  8.25,  8.00,  7.75,  7.50,  7.25,  7.00,  6.75,
               6.50,  6.25,  6.00,  5.75,  5.50]  # redshift grid for the 1D radiation-profile solver
  fXh: 'constant'               # 'constant' (fXh=0.11) or 'variable' (fit fXh = xe^0.225)
  halo_mass_accretion_alpha: [0.785, 0.795]  # range of mass-accretion-rate coefficients to solve profiles for
  halo_mass_bin_min: 1.0e+7      # minimum halo mass bin, in Msun
  halo_mass_bin_max: 1.0e+15     # maximum halo mass bin, in Msun
  halo_mass_nbin: 40             # number of halo mass bins
  HI_frac: 0.92                  # HI number fraction (only used when running H_He_Final)
  clumping: 1                    # rescale the background density (1 = normal 2-halo-term profile)
  z_decoupling: 135              # redshift at which gas decouples from the CMB and cools adiabatically
  z_source_start: 35.0           # maximum lookback redshift for X-ray/ionisation integrals
  ode_rtol: 0.01                 # relative tolerance for ODE integrations (R_bubble, rho_heat)
  ode_atol: 0.01                 # absolute tolerance for ODE integrations (R_bubble, rho_heat)
  ode_method: 'RK45'             # scipy.integrate.solve_ivp method ('RK45', 'LSODA', 'Radau', 'BDF', ...)

source:
  source_type: 'SED'             # 'SED', 'Ghara', 'Ross', or 'constant'
  Nion: 2000                     # number of ionizing photons per baryon in stars
  energy_cutoff_min_xray: 500    # lower energy cutoff for the X-ray band, in eV
  energy_cutoff_max_xray: 10000  # upper energy cutoff for the X-ray band, in eV
  energy_min_sed_xray: 200       # minimum energy of the X-ray SED normalization, in eV
  energy_max_sed_xray: 10000     # maximum energy of the X-ray SED normalization, in eV
  alS_xray: 1.5                  # X-ray power-law index (photons/s/Hz ~ nu^-alS_xray)
  xray_normalisation: 1.02e+40 # 0.3 * 3.4e40  # X-ray normalization, in (erg/s) * (yr/Msun)
  n_lyman_alpha_photons: 9690    # number of Lyman-alpha photons per baryon in stars
  lyman_alpha_power_law: 0.0     # Lyman-alpha power-law index (0 = constant, 1 = linear, 2 = quadratic)
  f0_esc: 0.2                    # photon escape fraction f_esc = f0_esc * (M/Mp_esc)^pl_esc
  Mp_esc: 1.0e+10                # pivot mass for the escape fraction
  pl_esc: 0.5                    # power-law index for the escape fraction
  f_st: 0.2                      # prefactor of the star-formation efficiency f_star(M)
  g1: 0.49                       # star-formation-rate power-law index
  g2: -0.61                      # star-formation-rate power-law index
  g3: 4                          # low-mass suppression term power-law index
  g4: -4                         # low-mass suppression term power-law index
  Mp: 1.0768e+11 # 1.6e11 * cosmology.h0  # pivot mass of the double power law describing the star-formation rate
  Mt: 1.0e+9                     # turnover mass of the low-mass suppression term
  halo_mass_min: 1.0e+8          # minimum mass of star-forming halos considered when painting
  halo_mass_max: 1.0e+16         # maximum mass of star-forming halos considered when painting
  min_xHII_value: 0              # lower limit for the ionization fraction (pixels below this are clipped to it)
  mass_accretion_lookback: 10    # number of snapshots to look back when fitting per-halo accretion rate alpha
  alpha_fallback: 'mean'         # fallback alpha for halos without a usable merger-tree fit: float, 'mean', or 'median'
  t_source_age: null             # maximum source age in Myr (null = integrate back to solver.z_source_start)
  # f_st grid precomputation (used by RadiationProfileFstSolver)
  f_st_grid_min: 0.01            # minimum f_st value for precomputing (mass, alpha, f_st, z) radiation profiles
  f_st_grid_max: 0.2             # maximum f_st value for precomputing (mass, alpha, f_st, z) radiation profiles
  f_st_grid_n: 30                # number of f_st grid points for precomputing radiation profiles
  # stochastic f_st painting controls (used by PaintingCoordinator.paint_single_fstar)
  f_st_paint_distribution: 'lognormal'  # distribution used to sample per-halo f_st: 'lognormal', 'normal', or 'uniform'
  f_st_paint_sigma: 0.5          # width parameter for the f_st sampling distribution
  f_st_paint_min: 0.01           # lower clipping bound for sampled f_st
  f_st_paint_max: 0.2            # upper clipping bound for sampled f_st
  f_st_paint_seed: null          # optional RNG seed for reproducible per-snapshot f_st sampling

cosmology:
  Om: 0.315                      # matter density parameter
  Ob: 0.049                      # baryon density parameter
  Ol: 0.685                      # dark energy density parameter
  rho_c: 2.775e+11               # critical density of the universe, in Msun/h / (Mpc/h)^3
  h0: 0.673                      # dimensionless Hubble parameter
  sigma_8: 0.83                  # amplitude of the matter power spectrum on 8 Mpc/h scales
  ns: 0.96                       # scalar spectral index

cosmo_sim:
  density_source: '2LPT'          # which mechanism produces the density field: '1LPT', '2LPT', '3LPT', or 'external'
                                  # (metadata only -- this script builds a SecondOrderLPT solver directly, matching this value)
  mass_assignment: 'CIC'          # scheme for painting the LPT-generated density field: NGP, CIC, TSC, or PCS
  oversample: 1                   # internal resolution factor, downsampled back to Ncell (LPTBase.get_density's painting mesh)
  random_seed: 12345             # random seed for density-field generation (read directly as the LPT IC seed by this script)
  snapshot_redshifts: [20.0, 19.5, 19.0, 18.5, 18.0, 17.5, 17.0, 16.5, 16.0,
                       15.5, 15.0, 14.5, 14.0, 13.5, 13.0, 12.5, 12.0, 11.5,
                       11.0, 10.5, 10.0, 9.5, 9.0, 8.5, 8.0, 7.5, 7.0, 6.5,
                       6.0, 5.5]  # redshifts of cosmo-sim snapshots to paint (null = use the full solver.redshifts grid)
  file_root: null                # path to external N-body input files; unused by this script's LPTHaloLoader
                                  # (only relevant to N-body loaders, e.g. ThesanLoader/Py21cmFastLoader)

halo_sim:
  halo_source: 'CHMF'             # how halo catalogs are generated: 'CHMF' (conditional halo mass function sampling) or 'external'
  hmf_model: 'ST'                 # only meaningful when halo_source is 'CHMF': 'PS' (pure EPS) or 'ST' (Sheth-Tormen calibrated, 21cmFAST-style)
  delta_c: 1.686                  # linear collapse threshold used by the CHMF
  R_env: null                     # environmental smoothing scale in Mpc/h for CHMF conditioning (null = use the cell size)
  n_mass_bins: 40                 # number of log-spaced mass bins for CHMF sampling
  halo_mass_min: 1.0e+8           # lower bound of the CHMF sampling mass range, in Msun (independent of source.halo_mass_min)
  halo_mass_max: 1.0e+16          # soft upper bound of the CHMF sampling mass range, in Msun (the real ceiling is set by M_env/box size)
  random_seed: 12345              # RNG seed for halo-catalog generation (Poisson draws + intra-cell positions), independent of cosmo_sim.random_seed
                                  # (read directly as this script's LPTHaloLoader halo_seed)
  mass_assignment: 'NGP'          # scheme for painting halo positions (HaloCatalog.to_mesh) -- leave at NGP, see HaloSimParameters docstring
